openapi: 3.0.0
info:
  title: 'Pera Mobile API'
  description: 'REST API for the Pera mobile application. Supports admin and member authentication via JWT bearer tokens. Admin endpoints require Spatie web-guard permissions (e.g. budget_list, user_create).'
  version: 1.0.0
servers:
  -
    url: /api
    description: 'API base path'
paths:
  /login:
    post:
      tags:
        - Authentication
      summary: 'Member login'
      description: 'Authenticate a member using phone number and password. Returns a JWT bearer token.'
      operationId: memberLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberLoginRequest'
      responses:
        200:
          description: 'Login successful'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        422:
          description: 'Validation error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security: []
  /admin/login:
    post:
      tags:
        - Authentication
      summary: 'Admin login'
      description: 'Authenticate an administrator using email and password. Returns a JWT bearer token with roles and permissions.'
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        200:
          description: 'Login successful'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        422:
          description: 'Validation error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security: []
  /me:
    get:
      tags:
        - Authentication
      summary: 'Get authenticated user'
      description: 'Returns the current user profile, roles, and permissions.'
      operationId: getAuthenticatedUser
      responses:
        200:
          description: 'Authenticated user'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/AuthUser'
                type: object
        401:
          description: Unauthenticated
  /logout:
    post:
      tags:
        - Authentication
      summary: Logout
      description: 'Invalidate the current JWT token.'
      operationId: logout
      responses:
        200:
          description: 'Logout successful'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse'
        401:
          description: Unauthenticated
  /dashboard:
    get:
      tags:
        - Dashboard
      summary: 'Member dashboard'
      description: 'Returns dashboard data for the authenticated member.'
      operationId: memberDashboard
      parameters:
        -
          name: date_from
          in: query
          schema:
            type: string
            format: date
        -
          name: date_to
          in: query
          schema:
            type: string
            format: date
      responses:
        200:
          description: 'Dashboard data'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse'
        403:
          description: Forbidden
  /admin/dashboard:
    get:
      tags:
        - Dashboard
      summary: 'Admin dashboard'
      description: 'Returns admin dashboard widgets based on user permissions.'
      operationId: adminDashboard
      parameters:
