  /files/upload:
    post:
      tags:
        - Files
      summary: 'Upload file'
      description: 'Upload a file (image, document, etc.). Admin only.'
      operationId: uploadFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
              type: object
      responses:
        200:
          description: 'File uploaded'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse'
  /files/delete:
