components:
  schemas:
    ApiSuccessResponse:
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Success
        data:
          type: object
          nullable: true
      type: object
    ApiErrorResponse:
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 'An error occurred'
        errors:
          type: object
          nullable: true
      type: object
    MemberLoginRequest:
      required:
        - phone
        - password
      properties:
        phone:
          type: string
          example: '01712345678'
        password:
          type: string
          format: password
          example: Abc1234!
      type: object
    AdminLoginRequest:
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@gmail.com
        password:
          type: string
          format: password
          example: Abc1234!
      type: object
    LoginResponse:
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Login successful.'
        data:
          properties:
            token:
              type: string
            token_type:
              type: string
              example: bearer
            expires_in:
              type: integer
              example: 3600
            user:
              $ref: '#/components/schemas/AuthUser'
          type: object
      type: object
    AuthUser:
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'John Doe'
        phone:
          type: string
          example: '01712345678'
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        image:
          type: string
          nullable: true
        status:
          type: boolean
          example: true
        last_login_at:
          type: string
          format: date-time
          nullable: true
        account_type:
          type: string
          example: admin
          enum:
            - admin
            - member
        roles:
          type: array
          items:
            properties:
              name:
                type: string
              guard_name:
                type: string
              label:
                type: string
                nullable: true
            type: object
        permissions:
          type: array
          items:
            type: string
          example:
            - budget_list
            - user_create
      type: object
    DateRangeFilters:
      properties:
        date_from:
          type: string
          format: date
          nullable: true
        date_to:
          type: string
          format: date
          nullable: true
      type: object
  securitySchemes:
    bearerAuth:
      type: http
      description: 'JWT token from POST /api/login or POST /api/admin/login. Format: Bearer {token}'
      bearerFormat: JWT
      scheme: bearer
security:
  -
    bearerAuth: []
tags:
  -
    name: Authentication
    description: 'Login, logout, and current user'
  -
    name: Dashboard
    description: 'Admin and member dashboards'
  -
    name: 'Users & Access'
    description: 'Users, roles, and permissions'
  -
    name: Finance
    description: 'Budgets, expenses, savings, and goals'
  -
    name: Study
    description: 'Subjects, topics, notes, study goals, and exams'
  -
    name: 'Tasks & Habits'
    description: 'Task and habit management'
  -
    name: Notices
    description: 'Member notices and admin notice management'
  -
    name: Reports
    description: 'Administrative reports and PDF exports'
  -
    name: Notifications
    description: 'In-app notifications'
  -
    name: Files
    description: 'File upload and delete'
  -
    name: Members
    description: 'Member list for mobile'
